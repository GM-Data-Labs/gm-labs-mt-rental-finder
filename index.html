<!doctype html>
<html lang="en">
<head>
<script>/* Contact address used by every mailto on this page: change it here only. */
const CONTACT_EMAIL = "gm-labs@mail.grokbot.com";</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GM Labs · Montana Distressed Rental Finder</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{--ink:#202124;--muted:#5f6368;--line:#dadce0;--blue:#1a73e8;--red:#d93025;--green:#188038;--amber:#f9ab00;--bg:#fff;--soft:#f8f9fa}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
header{text-align:center;padding:72px 16px 8px}
.brand{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:34px;font-weight:400;margin:6px 0 6px;letter-spacing:-.5px}h1 b{font-weight:600}
.tag{color:var(--muted);margin:0 auto;max-width:640px}
.search{max-width:720px;margin:22px auto 0;display:flex;gap:8px;padding:0 16px}
.search select,.search input{height:46px;border:1px solid var(--line);border-radius:24px;padding:0 18px;font-size:16px;background:#fff;color:var(--ink)}
.search input{flex:1;min-width:0;box-shadow:0 1px 3px rgba(32,33,36,.12)}.search input:focus,.search select:focus{outline:none;border-color:var(--blue);box-shadow:0 1px 6px rgba(32,33,36,.28)}
.filters{max-width:980px;margin:18px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 26px}
.f label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.f label b{color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--blue)}
.checks{max-width:980px;margin:12px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer;user-select:none;background:#fff}
.chip input{accent-color:var(--blue);margin:0}.chip:has(input:checked){background:#e8f0fe;border-color:#d2e3fc;color:#174ea6}
.bar{max-width:980px;margin:16px auto 0;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.bar .count{color:var(--muted);font-size:14px;flex:1}.bar select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:14px;background:#fff}
.tabs button{border:1px solid var(--line);background:#fff;padding:6px 14px;font-size:14px;cursor:pointer}.tabs button:first-child{border-radius:6px 0 0 6px}.tabs button:last-child{border-radius:0 6px 6px 0;border-left:0}
.tabs button.on{background:#e8f0fe;color:#174ea6;border-color:#d2e3fc}
main{max-width:980px;margin:0 auto;padding:6px 16px 20px}
.card{padding:16px 0;border-bottom:1px solid #f1f3f4;display:grid;grid-template-columns:56px 1fr;gap:14px}
.score{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;background:var(--amber)}
.score.s6{background:#e37400}.score.s8{background:var(--red)}
.addr{font-size:18px;color:#1a0dab;margin:0}.meta{color:var(--muted);font-size:13px;margin:2px 0 6px}
.sig{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}.sig li{font-size:13px;background:var(--soft);border:1px solid #eee;border-radius:12px;padding:2px 10px}
.sig li.hot{background:#fce8e6;border-color:#fad2cf;color:#a50e0e}
.ref{font-size:12px;color:var(--muted);margin-top:8px}.ref code{font-size:12px;background:var(--soft);padding:1px 5px;border-radius:4px}
#map{height:560px;border:1px solid var(--line);border-radius:8px;margin-top:12px;display:none}
.more{text-align:center;margin:16px}.more button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 20px;cursor:pointer;font-size:14px}
.i{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:4px;border-radius:50%;border:1px solid #bdc1c6;background:#fff;color:#5f6368;font:italic 600 10px/1 Georgia,serif;cursor:help;padding:0;vertical-align:middle}
.i:hover,.i:focus-visible{border-color:var(--blue);color:var(--blue);outline:none}
.tip{display:none;position:absolute;z-index:1000;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:240px;padding:8px 10px;border-radius:6px;background:#3c4043;color:#fff;font:400 12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;text-align:left;white-space:normal;box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none}
.tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#3c4043}
.i:hover .tip,.i:focus-visible .tip,.i.open .tip,.i-badge:hover .tip,.i-badge:focus-visible .tip,.i-badge.open .tip{display:block}
.i-badge{position:relative;border:0;cursor:help;font-family:inherit;padding:0}.i-badge .tip{left:0;transform:none;font-weight:400}.i-badge .tip::after{left:22px}
.f label>span{display:inline-flex;align-items:center}
footer{text-align:center;color:#80868b;font-size:12px;padding:28px 16px 36px;margin-top:28px;border-top:1px solid #f1f3f4}footer a{color:#80868b}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:720px){.tip,.i-badge .tip{position:fixed;left:12px;right:12px;bottom:16px;top:auto;transform:none;width:auto;max-width:none;font-size:14px;padding:12px 14px}.tip::after{display:none}h1{font-size:25px}header{padding:26px 14px 6px}.search{flex-direction:column}.search input,.search select{flex:none;width:100%}.filters{grid-template-columns:1fr;gap:10px}
.card{grid-template-columns:44px 1fr;gap:10px}.score{width:40px;height:40px;font-size:16px}.addr{font-size:16px}#map{height:420px}}
</style>
</head>
<body>
<header>
  <div class="brand">GM Labs</div>
  <h1><b>Montana</b> Distressed Rental Finder</h1>
  <p class="tag">Montana duplexes to apartment buildings whose owners show signs they may want to sell.</p>
</header>
<div class="search">
  <select id="county" aria-label="County"><option value="">All counties</option><option>Yellowstone</option><option>Gallatin</option><option>Park</option></select>
  <input id="q" type="search" placeholder="Search an address or town, e.g. Billings, Bozeman, Livingston" aria-label="Search address or town">
</div>
<div class="filters">
  <div class="f"><label for="units"><span>Minimum units <button type="button" class="i" aria-label="What is minimum units?" aria-expanded="false" data-tip="units">i<span class="tip" role="tooltip">Number of rental units in the building. Set a higher minimum to see only bigger properties.</span></button></span><b id="unitsv">2+</b></label><input id="units" type="range" min="2" max="50" value="2"></div>
  <div class="f"><label for="score"><span>Minimum score <button type="button" class="i" aria-label="What is minimum score?" aria-expanded="false" data-tip="score">i<span class="tip" role="tooltip">Score adds up the warning signs on a property. Higher means more likely to sell. 4+ is a solid lead.</span></button></span><b id="scorev">4</b></label><input id="score" type="range" min="4" max="12" value="4"></div>
  <div class="f"><label for="tax"><span>Minimum back taxes owed <button type="button" class="i" aria-label="What is minimum back taxes owed?" aria-expanded="false" data-tip="tax">i<span class="tip" role="tooltip">Unpaid property taxes on the parcel. Owners who fall behind are often under money pressure and open to an offer.</span></button></span><b id="taxv">$0</b></label><input id="tax" type="range" min="0" max="20000" step="250" value="0"></div>
</div>
<div class="checks" id="checks">
  <label class="chip"><input type="checkbox" value="sale">Trustee / sheriff sale <button type="button" class="i" aria-label="What is trustee / sheriff sale?" aria-expanded="false" data-tip="sale">i<span class="tip" role="tooltip">A foreclosure (trustee) or sheriff sale is scheduled. The owner has a deadline, so a quick sale can beat losing the property.</span></button></label>
  <label class="chip"><input type="checkbox" value="tax">Tax delinquent <button type="button" class="i" aria-label="What is tax delinquent?" aria-expanded="false" data-tip="taxd">i<span class="tip" role="tooltip">The owner is behind on property taxes. Growing back taxes are a common sign of a tired or stretched owner.</span></button></label>
  <label class="chip"><input type="checkbox" value="code_open">Open code case <button type="button" class="i" aria-label="What is open code case?" aria-expanded="false" data-tip="code">i<span class="tip" role="tooltip">The city has an open code-enforcement case on the property. Repairs cost money, and some owners would rather sell.</span></button></label>
  <label class="chip"><input type="checkbox" value="absentee">Absentee owner <button type="button" class="i" aria-label="What is absentee owner?" aria-expanded="false" data-tip="abs">i<span class="tip" role="tooltip">The owner doesn't live at the property. Remote owners tend to be less attached and more willing to sell.</span></button></label>
  <label class="chip"><input type="checkbox" value="out_of_state">Out-of-state owner <button type="button" class="i" aria-label="What is out-of-state owner?" aria-expanded="false" data-tip="oos">i<span class="tip" role="tooltip">The owner lives outside Montana. Managing a rental from far away is hard, so these owners often want out.</span></button></label>
  <label class="chip"><input type="checkbox" value="long_owned">Owned 10+ years <button type="button" class="i" aria-label="What is owned 10+ years?" aria-expanded="false" data-tip="long">i<span class="tip" role="tooltip">Same owner for 10+ years. Long-time owners often have lots of equity and may be ready to retire or cash out.</span></button></label>
</div>
<div class="bar">
  <span class="count" id="count">Loading…</span>
  <select id="sort" aria-label="Sort"><option value="score">Sort: score</option><option value="units">Sort: units</option><option value="tax_owed">Sort: taxes owed</option><option value="years_owned">Sort: years owned</option></select>
  <span class="tabs"><button id="tList" class="on">List</button><button id="tMap">Map</button></span>
</div>
<main>
  <div id="list"></div>
  <div class="more" id="more" hidden><button>Show more</button></div>
  <div id="map"></div>
</main>
<footer>GM Labs · Data from public county records, updated Oct 2026 · <a id="contact" href="#">Contact</a></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(() => {
const $ = id => document.getElementById(id), money = n => "$" + Math.round(n).toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let all = [], shown = [], page = 30, map, layer, view = "list";
const linkName = u => u.includes("csadelin") ? "County tax page" : u.includes("bids.htm") ? "Trustee sale list" : u.includes("SheriffSales") ? "Sheriff sale list" : "Source";
function card(L) {
  const cls = L.score >= 8 ? "s8" : L.score >= 6 ? "s6" : "";
  const meta = [L.city !== "unknown" ? L.city : "", L.county + " County", L.units + " units", L.year_built !== "unknown" ? "built " + L.year_built : "",
                typeof L.value === "number" ? "assessed " + money(L.value) : ""].filter(Boolean).join(" · ");
  const sig = L.signals.map(s => `<li class="${/sale|taxes|code/i.test(s) ? "hot" : ""}">${esc(s)}</li>`).join("");
  const links = L.links.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${linkName(u)}</a>`).join(" · ");
  return `<div class="card"><button type="button" class="score ${cls} i-badge" aria-label="Score ${L.score}. What is the score?" aria-expanded="false">${L.score}<span class="tip" role="tooltip">Score adds up the warning signs on this property. Higher means more likely to sell. 4+ is a solid lead.</span></button><div>
    <p class="addr">${esc(L.address)}</p><p class="meta">${esc(meta)}</p><ul class="sig">${sig}</ul>
    <div class="ref">Tax ID <code>${esc(L.tax_id)}</code> · Geocode <code>${esc(L.geocode.join(", "))}</code>${links ? " · " + links : ""}</div></div></div>`;
}
function apply() {
  const c = $("county").value, q = $("q").value.trim().toLowerCase(), u = +$("units").value, s = +$("score").value, t = +$("tax").value;
  const req = [...document.querySelectorAll("#checks input:checked")].map(x => x.value), k = $("sort").value;
  $("unitsv").textContent = u >= 50 ? "50+" : u + "+"; $("scorev").textContent = s + "+"; $("taxv").textContent = t ? money(t) + "+" : "$0";
  shown = all.filter(L => (!c || L.county === c) && L.units >= u && L.score >= s && (L.tax_owed || 0) >= t && req.every(r => L[r]) &&
                         (!q || (L.address + " " + L.city + " " + L.county).toLowerCase().includes(q)))
             .sort((a, b) => (b[k] ?? -1) - (a[k] ?? -1) || b.score - a.score || b.units - a.units);
  page = 30; $("count").textContent = `${shown.length.toLocaleString()} lead${shown.length === 1 ? "" : "s"}` + (c ? ` in ${c} County` : " across 3 counties");
  render();
}
function render() {
  if (view === "list") {
    $("list").innerHTML = shown.length ? shown.slice(0, page).map(card).join("") : `<div class="empty">No leads match. Try lowering the filters.</div>`;
    $("more").hidden = shown.length <= page;
  } else drawMap();
}
function drawMap() {
  if (!map) {
    map = L.map("map", {scrollWheelZoom: false});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  layer.clearLayers(); const pts = [];
  shown.filter(x => x.lat).forEach(x => {
    const col = x.score >= 8 ? "#d93025" : x.score >= 6 ? "#e37400" : "#f9ab00";
    L.circleMarker([x.lat, x.lon], {radius: 6 + Math.min(x.units, 40) / 8, color: "#fff", weight: 1.5, fillColor: col, fillOpacity: .9})
     .bindPopup(`<b>${esc(x.address)}</b><br>Score ${x.score} · ${x.units} units<br>${x.signals.slice(0, 3).map(esc).join("<br>")}`).addTo(layer);
    pts.push([x.lat, x.lon]);
  });
  setTimeout(() => { map.invalidateSize(); pts.length ? map.fitBounds(pts, {padding: [30, 30], maxZoom: 14}) : map.setView([46.0, -110.0], 7); }, 0);
}
function setView(v) {
  view = v; $("tList").classList.toggle("on", v === "list"); $("tMap").classList.toggle("on", v === "map");
  $("list").style.display = v === "list" ? "" : "none"; $("map").style.display = v === "map" ? "block" : "none"; $("more").hidden = v === "map" || shown.length <= page; render();
}
["county", "q", "units", "score", "tax", "sort"].forEach(id => $(id).addEventListener("input", apply));
$("checks").addEventListener("change", apply);
$("more").querySelector("button").onclick = () => { page += 30; render(); };
$("tList").onclick = () => setView("list"); $("tMap").onclick = () => setView("map");
const tips = () => document.querySelectorAll(".i.open,.i-badge.open");
const closeTips = except => tips().forEach(b => { if (b !== except) { b.classList.remove("open"); b.setAttribute("aria-expanded", "false"); } });
document.addEventListener("click", e => {
  const b = e.target.closest(".i,.i-badge");
  if (!b) { closeTips(); return; }
  e.preventDefault(); e.stopPropagation();               // don't toggle the checkbox the icon sits in
  closeTips(b); const on = !b.classList.contains("open"); b.classList.toggle("open", on); b.setAttribute("aria-expanded", String(on));
}, true);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTips(); });
$("contact").href = "mailto:" + CONTACT_EMAIL;
fetch("assets/s7.dat").then(r => r.json()).then(d => {
  all = d.r; $("score").max = Math.max(...all.map(x => x.score), 5);
  apply(); if (location.hash === "#map") setView("map");
}).catch(() => { $("count").textContent = "Could not load the data. Please refresh."; });
})();
</script>
</body>
</html>
